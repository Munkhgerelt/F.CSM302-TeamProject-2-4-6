<svg xmlns="http://www.w3.org/2000/svg" width="468pt" height="330pt" viewBox="0 0 468 330" font-family="Times New Roman, Times, serif" font-size="12" fill="#000"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="468" height="330" fill="#fff"/><rect x="10" y="4" width="100" height="24" rx="3" fill="#fff" stroke="#333" stroke-width="1"/><text x="60.0" y="19.8" text-anchor="middle">Хэрэглэгч</text><line x1="60" y1="28" x2="60" y2="186" stroke="#888" stroke-width=".7" stroke-dasharray="3 3"/><rect x="180" y="4" width="100" height="24" rx="3" fill="#fff" stroke="#333" stroke-width="1"/><text x="230.0" y="19.8" text-anchor="middle">app.js</text><line x1="230" y1="28" x2="230" y2="186" stroke="#888" stroke-width=".7" stroke-dasharray="3 3"/><rect x="350" y="4" width="100" height="24" rx="3" fill="#fff" stroke="#333" stroke-width="1"/><text x="400.0" y="19.8" text-anchor="middle">Сервер</text><line x1="400" y1="28" x2="400" y2="186" stroke="#888" stroke-width=".7" stroke-dasharray="3 3"/><path d="M60,52 L229,52" fill="none" stroke="#333" stroke-width="1" marker-end="url(#a)"/><text x="145" y="47" text-anchor="middle">«Ажиллуулах» (Replay)</text><text x="236" y="68" text-anchor="start">mySeq = ++runSeq (= 1)</text><path d="M230,88 L399,88" fill="none" stroke="#333" stroke-width="1" marker-end="url(#a)"/><text x="330" y="83" text-anchor="middle">POST /api/run</text><path d="M60,118 L229,118" fill="none" stroke="#333" stroke-width="1" marker-end="url(#a)"/><text x="145" y="113" text-anchor="middle">Горим → Lockstep</text><text x="236" y="134" text-anchor="start">runSeq++ (= 2), app.live = null</text><path d="M400,172 L231,172" fill="none" stroke="#333" stroke-width="1" marker-end="url(#a)"/><text x="315" y="167" text-anchor="middle">хоцорсон хариу</text><rect x="1" y="194" width="228" height="130" rx="3" fill="#fff" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/><text x="115.0" y="224.0" text-anchor="middle" font-weight="bold">Засварын өмнө (636734a)</text><text x="115.0" y="239.5" text-anchor="middle">Хариуг app.trace-д бичээд render()</text><text x="115.0" y="255.0" text-anchor="middle">дуудна. app.live = null тул</text><text x="115.0" y="270.5" text-anchor="middle">renderThreads() TypeError өгнө.</text><text x="115.0" y="286.0" text-anchor="middle">Дахин «Ажиллуулах» дарахад pause()</text><text x="115.0" y="301.5" text-anchor="middle">мөн унаж, Lockstep эхлэхгүй.</text><rect x="239" y="194" width="228" height="130" rx="3" fill="#dbe7f6" stroke="#1f4e8c" stroke-width="1.2"/><text x="353.0" y="224.0" text-anchor="middle" font-weight="bold">Засварын дараа (6358ecb)</text><text x="353.0" y="239.5" text-anchor="middle">mySeq (1) ≠ runSeq (2) тул хариуг</text><text x="353.0" y="255.0" text-anchor="middle">хаяна. render() нь app.live = null</text><text x="353.0" y="270.5" text-anchor="middle">үед зурахгүй буцна. Дараагийн</text><text x="353.0" y="286.0" text-anchor="middle">«Ажиллуулах» Lockstep-ийг хэвийн</text><text x="353.0" y="301.5" text-anchor="middle">эхлүүлнэ.</text></svg>